[build]
  command = "npm run build"
  publish = "dist"

# Keep one production origin; preserve paths and query parameters.
[[redirects]]
  from = "https://www.yusuprd.com/*"
  to = "https://yusuprd.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://yusuprd.com/*"
  to = "https://yusuprd.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.yusuprd.com/*"
  to = "https://yusuprd.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/images/social/portfolio-preview.png"
  to = "/images/social/yusup-rejebov-og.png"
  status = 301

# Without this rule Netlify may automatically serve a SPA shell for unknown
# paths. A real 404 keeps nonexistent pages out of the search index.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
